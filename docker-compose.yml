# 本地依赖：MySQL + Redis（与 apps/api/.env.example 默认值对齐）
services:
  mysql:
    image: mysql:8
    container_name: admin-template-mysql
    restart: unless-stopped
    ports:
      # 主机 3307，避免与本机已安装的 MySQL（常占用 3306）冲突
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: change_me
      MYSQL_DATABASE: admin_template
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pchange_me']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:latest
    container_name: admin-template-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mysql_data:
  redis_data:
