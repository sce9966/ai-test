<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="platform" x1="160" y1="360" x2="480" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="panelA" x1="120" y1="80" x2="260" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="panelB" x1="360" y1="60" x2="520" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#93C5FD" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- floating cards -->
  <g filter="url(#soft)">
    <rect x="88" y="72" width="150" height="110" rx="16" fill="url(#panelA)" stroke="#BFDBFE"/>
    <rect x="108" y="96" width="72" height="8" rx="4" fill="#93C5FA"/>
    <rect x="108" y="116" width="110" height="8" rx="4" fill="#BFDBFE"/>
    <rect x="108" y="136" width="90" height="8" rx="4" fill="#DBEAFE"/>
    <circle cx="210" cy="104" r="14" fill="#3B82F6" opacity="0.9"/>

    <rect x="390" y="48" width="160" height="130" rx="16" fill="url(#panelB)" stroke="#C7D2FE"/>
    <rect x="414" y="76" width="48" height="48" rx="10" fill="#6366F1" opacity="0.85"/>
    <rect x="476" y="82" width="52" height="8" rx="4" fill="#A5B4FC"/>
    <rect x="476" y="100" width="40" height="8" rx="4" fill="#C7D2FE"/>
    <path d="M414 154h112" stroke="#E0E7FF" stroke-width="8" stroke-linecap="round"/>

    <rect x="430" y="210" width="130" height="96" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
    <path d="M454 278v-36l24 16 22-28 22 20" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="454" cy="278" r="4" fill="#60A5FA"/>
    <circle cx="478" cy="258" r="4" fill="#3B82F6"/>
    <circle cx="500" cy="230" r="4" fill="#2563EB"/>
    <circle cx="522" cy="250" r="4" fill="#60A5FA"/>

    <rect x="96" y="220" width="100" height="84" rx="14" fill="#FFFFFF" stroke="#BFDBFE"/>
    <rect x="116" y="244" width="18" height="40" rx="4" fill="#93C5FD"/>
    <rect x="142" y="228" width="18" height="56" rx="4" fill="#3B82F6"/>
    <rect x="168" y="252" width="18" height="32" rx="4" fill="#60A5FA"/>
  </g>

  <!-- platform -->
  <ellipse cx="320" cy="370" rx="170" ry="28" fill="url(#platform)" opacity="0.85"/>
  <ellipse cx="320" cy="362" rx="150" ry="18" fill="#93C5FD" opacity="0.55"/>

  <!-- character -->
  <g transform="translate(284 236)">
    <ellipse cx="36" cy="118" rx="34" ry="10" fill="#93C5FD" opacity="0.5"/>
    <rect x="18" y="48" width="36" height="54" rx="14" fill="#2563EB"/>
    <circle cx="36" cy="28" r="18" fill="#FDE68A"/>
    <path d="M18 22c4-14 32-14 36 0-8 4-28 4-36 0Z" fill="#1E3A8A"/>
    <rect x="8" y="62" width="14" height="34" rx="7" fill="#FDE68A"/>
    <rect x="50" y="62" width="14" height="34" rx="7" fill="#FDE68A"/>
    <rect x="20" y="100" width="12" height="28" rx="6" fill="#1E40AF"/>
    <rect x="40" y="100" width="12" height="28" rx="6" fill="#1E40AF"/>
  </g>

  <!-- orbit dots -->
  <circle cx="250" cy="180" r="6" fill="#60A5FA"/>
  <circle cx="380" cy="160" r="5" fill="#818CF8"/>
  <circle cx="300" cy="120" r="4" fill="#93C5FD"/>
</svg>
